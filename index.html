<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>JavaScript Quiz | Premium Edition</title>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- style.css -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="background-animation"></div>
    <div class="wrapper glass-card">
        <div class="welcome_text">
            <div class="logo-area">
                <i class="fas fa-brain"></i>
            </div>
            <h1>Ready to Challenge Yourself?</h1>
            <p>Enter your details below to start the quiz.</p>
            <form class="welcome_form" name="welcome_form" onsubmit="submitForm(event)">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" name="name" placeholder="Enter your name" required autocomplete="off">
                </div>
                <button type="submit" class="btn-start">Start Quiz <i class="fas fa-arrow-right"></i></button>
            </form>
        </div>
    </div>

    <!-- js -->
    <script src="js/start.js"></script>
</body>

</html>
