<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Results | Premium Edition</title>

    <!-- style.css -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="

<body>
    <div class="background-animation"></div>
    <div class="wrapper glass-card">
        <div class="welcome_text">
            <i class="fas fa-trophy award_icon"></i>
            <h3 class="username">Well Done, <span class="name"></span>!</h3>

            <div class="score-card">
                <p class="userpoints">Your Score</p>
                <div class="points"></div>
                <!-- Logic for time taken if implemented -->
                <!-- <p class="usertime hidden">Time taken <span class="time_taken"></span></p> -->
            </div>

            <a href="index.html" style="text-decoration: none;">
                <button class="btn-play-again"><i class="fas fa-redo"></i> Play Again</button>
            </a>
        </div>
    </div>

    <!-- js -->
    <script src="js/end.js"></script>
</body>

</html>
